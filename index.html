<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutty's English Quiz – harjoituskoe 4. luokka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f1ead7;
  --paper:#fffdf8;
  --sky:#c7e1ec;
  --sky-deep:#9cc6d8;
  --teal:#1d6a8a;
  --ink:#25303b;
  --ribbon:#e23d5f;
  --amber:#f7cf86;
  --leaf:#d3e6ae;
  --leaf-deep:#5f8f2a;
  --blush:#f4c5cf;
  --blush-deep:#b3314f;
  --head:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.5;
  background-color:var(--cream);
  background-image:repeating-linear-gradient(90deg,rgba(120,100,60,.05) 0 2px,transparent 2px 22px);
}
.wrap{max-width:880px;margin:0 auto;padding:0 1rem 4rem}

/* header */
.top{background:var(--sky);border-bottom:4px solid var(--teal)}
.top .wrap{display:flex;align-items:center;gap:1.2rem;padding-top:1.2rem;padding-bottom:1.2rem}
.top svg{flex:none;width:96px;height:96px}
.top h1{font-family:var(--head);font-weight:700;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.1;margin:0;color:var(--teal)}
.top p{margin:.35rem 0 0;max-width:46ch}
.scorebar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;font-weight:700}
.scorebar .wrap{display:flex;justify-content:space-between;gap:1rem;padding-top:.45rem;padding-bottom:.45rem;font-size:.98rem}
.scorebar span b{font-family:var(--head);font-size:1.15rem;color:var(--amber)}

/* tabs */
.tabs{display:flex;gap:.6rem;margin:1.4rem 0 1rem;flex-wrap:wrap}
.tab{
  flex:1 1 150px;cursor:pointer;border:3px solid var(--teal);background:var(--paper);color:var(--teal);
  font-family:var(--head);font-weight:600;font-size:1.15rem;padding:.7rem .8rem;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;transition:transform .15s,background .15s;
}
.tab small{font-family:var(--body);font-weight:600;font-size:.82rem;color:var(--ink)}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--teal);color:#fff}
.tab[aria-selected="true"] small{color:var(--sky)}
.tab .done{font-size:.9rem}
:focus-visible{outline:3px solid var(--ribbon);outline-offset:3px}

/* section */
.sec{margin:2.2rem 0}
.sec-head{display:flex;align-items:flex-start;gap:.9rem;margin-bottom:.8rem}
.ribbon{
  flex:none;background:var(--ribbon);color:#fff;font-family:var(--head);font-weight:700;font-size:1.5rem;
  width:44px;padding:.35rem 0 1.05rem;text-align:center;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);
}
.sec-head h2{font-family:var(--head);font-weight:600;font-size:1.55rem;margin:.1rem 0 0;color:var(--ribbon)}
.sec-head p{margin:.1rem 0 0}
.note{
  background:var(--sky);border:2px solid var(--teal);border-radius:18px;padding:.5rem .9rem;margin:0 0 1rem;
}
.note summary{cursor:pointer;font-weight:800;color:var(--teal)}
.note div{padding:.4rem 0;font-weight:600}
.note table{border-collapse:collapse;margin:.3rem 0}
.note td{padding:.1rem 1.1rem .1rem 0}
.note td:first-child{font-weight:800}

/* question card */
.q{
  display:flex;gap:.9rem;background:var(--paper);border-radius:6px;padding:1rem 1rem 1rem .9rem;margin:0 0 .9rem;
  box-shadow:0 2px 0 rgba(120,100,60,.25),0 6px 14px -8px rgba(60,50,20,.35);
  border-left:6px solid transparent;
}
.q.ok{border-left-color:var(--leaf-deep)}
.q.bad{border-left-color:var(--blush-deep)}
.num{
  flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;
  font-family:var(--head);font-weight:600;display:grid;place-items:center;margin-top:.1rem;
}
.qbody{flex:1;min-width:0}
.pic{font-size:3rem;line-height:1.1;margin:0 0 .3rem;letter-spacing:.1em}
.prompt{
  display:inline-block;background:var(--amber);border-radius:16px 16px 16px 4px;padding:.35rem .9rem;margin:0 0 .7rem;font-weight:700;
}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{
  display:block;text-align:center;border:2px solid var(--sky-deep);background:#fff;border-radius:12px;padding:.45rem .6rem;font-weight:700;transition:background .12s,border-color .12s;
}
.opt:hover span{background:var(--sky)}
.opt input:checked + span{background:var(--teal);border-color:var(--teal);color:#fff}
.opt input:focus-visible + span{outline:3px solid var(--ribbon);outline-offset:2px}
.q.locked .opt input{pointer-events:none}
.write{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem;font-weight:700}
.write input{
  font:inherit;font-weight:700;color:var(--teal);border:0;border-bottom:3px solid var(--teal);background:rgba(199,225,236,.35);
  padding:.25rem .5rem;min-width:9ch;width:min(100%,16rem);border-radius:6px 6px 0 0;
}
.write input.wide{width:min(100%,26rem)}
.write input:disabled{opacity:1}
.fb{margin-top:.7rem;font-weight:700;display:none}
.fb.show{display:inline-block;padding:.3rem .9rem;border-radius:16px 16px 4px 16px}
.fb.good{background:var(--leaf);color:#2f5313}
.fb.nope{background:var(--blush);color:#7a1d33}

/* buttons + results */
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin:1.5rem 0}
.btn{
  font-family:var(--head);font-weight:600;font-size:1.15rem;border:0;cursor:pointer;border-radius:999px;padding:.7rem 1.6rem;
  background:var(--ribbon);color:#fff;box-shadow:0 4px 0 #a82645;transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a82645}
.btn.alt{background:var(--paper);color:var(--teal);border:3px solid var(--teal);box-shadow:0 4px 0 var(--teal)}
.result{
  display:none;gap:1rem;align-items:center;background:var(--sky);border:3px solid var(--teal);border-radius:22px;padding:1rem 1.2rem;margin:1rem 0;
}
.result.show{display:flex}
.result svg{flex:none;width:70px;height:70px}
.result h3{font-family:var(--head);font-weight:600;font-size:1.5rem;margin:0;color:var(--teal)}
.result p{margin:.1rem 0 0;font-weight:700}
.stars{font-size:1.5rem;letter-spacing:.1em}
.grand{background:var(--ink);color:#fff;border-color:var(--amber)}
.grand h3{color:var(--amber)}
footer{text-align:center;font-size:.9rem;opacity:.75;margin-top:2rem}
@media (max-width:520px){
  .top svg{width:64px;height:64px}
  .q{padding:.8rem .7rem}
  .pic{font-size:2.4rem}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="nutty" viewBox="0 0 120 120">
      <path d="M12 96c-10-10-6-30 6-34 4 10 2 20 8 28z" fill="#8a96a3"/>
      <path d="M14 82l10-6M12 70l12-4" stroke="#25303b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="14" fill="#8a96a3"/><circle cx="90" cy="30" r="14" fill="#8a96a3"/>

      <path d="M22 58c10-14 26-14 38-6 12-8 28-8 38 6-2 16-14 22-26 18-6-2-8-6-12-6s-6 4-12 6c-12 4-24-2-26-18z" fill="#25303b"/>

      <circle cx="45.5" cy="59.5" r="1.4" fill="#fff"/><circle cx="77.5" cy="59.5" r="1.4" fill="#fff"/>

</svg>

<header class="top">
  <div class="wrap">
    <svg role="img" aria-label="Nutty-pesukarhu"><use href="#nutty"/></svg>
    <div>
      <h1>Nutty's English Quiz</h1>
      <p>Harjoituskoe 4. luokalle. Tee yksi osa kerrallaan, paina <b>Tarkista osa</b> ja katso, kuinka monta pistettä sait.</p>
    </div>
  </div>
</header>

<div class="scorebar" role="status" aria-live="polite">
  <div class="wrap">
    <span>Tarkistetut osat: <b id="sbParts">0 / 3</b></span>
    <span>Pisteet: <b id="sbScore">0 / 0</b></span>
  </div>
</div>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Kokeen osat" id="tabs"></div>
  <div id="panel" role="tabpanel"></div>
  <div class="result grand" id="grand" aria-live="polite"></div>
  <footer>Tehtävät perustuvat sanastoihin, kuvasanoihin ja kielioppiin kappaleista 1–3.</footer>
</main>

<script>
/* ---------- helpers ---------- */
const mc = (q, a, wrong, o = {}) => ({ t: 'mc', q, a, opts: [a, ...wrong], ...o });
const wr = (q, ans, o = {}) => ({ t: 'wr', q, ans: [].concat(ans), ...o });
const rep = (e, n) => e.repeat(n);

/* ---------- content ---------- */
const TABS = [
  {
    id: 'pics', name: 'Kuvasanat', sub: 'Mikä tämä on?', icon: '🖼️',
    sections: [
      {
        title: 'Kulkuvälineet', intro: 'Katso kuvaa. Valitse tai kirjoita oikea sana englanniksi.',
        items: [

          mc('Mikä tämä on?', 'a helicopter', ['a plane', 'a bus', 'a taxi'], { pic: '🚁' }),
          mc('Mitä pakettiauto on englanniksi?', 'a van', ['a truck', 'a taxi', 'a tram']),
          mc('Mitä lautta on englanniksi?', 'a ferry', ['a boat', 'a plane', 'a tram']),
          wr('Kirjoita englanniksi.', ['a train', 'train'], { pic: '🚆', art: true }),
          wr('Kirjoita englanniksi.', ['a tram', 'tram'], { pic: '🚋', art: true }),
          wr('Kirjoita englanniksi.', ['a motorbike', 'motorbike'], { pic: '🏍️', art: true }),
          wr('Britit sanovat a taxi. Mitä amerikkalaiset sanovat? a ___', ['cab']),
          wr('Britit sanovat an underground (train). Mitä amerikkalaiset sanovat? a ___ (train)', ['subway']),
        ]
      },
      {
        title: 'Paikat', intro: 'Mikä paikka on kyseessä?',
        items: [
          mc('Mikä tämä on?', 'a library', ['a school', 'a museum', 'a shop'], { pic: '📚' }),
          mc('Mikä tämä on?', 'a hospital', ['a bank', 'a station', 'a church'], { pic: '🏥' }),
          mc('Mikä tämä on?', 'a cinema', ['a theatre', 'a museum', 'a café'], { pic: '🎬' }),
          mc('Mitä kauppakeskus on englanniksi?', 'a mall', ['a department store', 'a shop', 'a station']),
          mc('Mitä asema on englanniksi?', 'a station', ['a school', 'a bank', 'a park']),
          wr('Kirjoita englanniksi.', ['a church', 'church'], { pic: '⛪', art: true }),
          wr('Kirjoita englanniksi.', ['a skyscraper', 'skyscraper'], { pic: '🏢', art: true }),
          wr('Kirjoita englanniksi.', ['a restaurant', 'restaurant'], { pic: '🍽️', art: true }),
          wr('Kirjoita englanniksi.', ['a café', 'café', 'a cafe', 'cafe'], { pic: '☕', art: true }),
          wr('Mitä teatteri on englanniksi? a ___', ['theatre', 'theater']),
          wr('Where\'s the cat? – It\'s in the ___. (puisto)', ['park'], { pic: '🐈🌳' }),
        ]
      },
      {
        title: 'Puutarha ja luonto', intro: 'Muista monikko! Jos kuvia on monta, sana päättyy monikkoon.',
        items: [
          mc('Mitä kuvassa on?', 'tomatoes', ['potatoes', 'pumpkins', 'strawberries'], { pic: rep('🍅', 3) }),
          mc('Mitä kuvassa on?', 'pumpkins', ['tomatoes', 'mushrooms', 'potatoes'], { pic: rep('🎃', 2) }),
          mc('Mitä kuvassa on?', 'mushrooms', ['cucumbers', 'herbs', 'peas'], { pic: rep('🍄', 2) }),
          mc('Mitä kurkkuja on englanniksi?', 'cucumbers', ['lettuce', 'tomatoes', 'potatoes']),
          mc('Mitä vadelmia on englanniksi?', 'raspberries', ['strawberries', 'blueberries', 'berries']),
          wr('Kirjoita englanniksi (monta).', ['potatoes'], { pic: rep('🥔', 2) }),
          wr('Kirjoita englanniksi (monta).', ['strawberries'], { pic: rep('🍓', 3) }),
          wr('Kirjoita englanniksi (monta).', ['blueberries'], { pic: rep('🫐', 3) }),
          wr('Kirjoita englanniksi (monta).', ['flowers'], { pic: rep('🌼', 2) }),
          wr('Mitä kiviä on englanniksi?', ['rocks']),
          wr('What colour is the lettuce? – ___.', ['green'], { pic: '🥬' }),
          wr('What colour are the strawberries? – ___.', ['red'], { pic: '🍓' }),
        ]
      }
    ]
  },
  {
    id: 'words', name: 'Kappalesanat', sub: 'Sanasto suomeksi ja englanniksi', icon: '📖',
    sections: [
      {
        title: 'What a start!', intro: 'Sanoja kappaleesta 1.',
        items: [
          mc('tired', 'väsynyt', ['nälkäinen', 'janoinen', 'valmis']),
          mc('hungry', 'nälkäinen', ['janoinen', 'väsynyt', 'vihainen']),
          mc('far', 'kaukana', ['lähellä', 'liian', 'vielä']),
          mc('a problem', 'ongelma', ['idea', 'kuski', 'osoite']),
          mc('on foot', 'jalkaisin', ['oikealla', 'vasemmalla', 'kaukana']),
          wr('Kirjoita englanniksi: lentokenttä', ['an airport', 'airport'], { art: true }),
          wr('Kirjoita englanniksi: kävellä', ['walk']),
          wr('Kirjoita englanniksi: kuski', ['a driver', 'driver'], { art: true }),

      },
      {
        title: 'Sightseeing', intro: 'Sanoja kappaleesta 2.',
        items: [
          mc('scared', 'peloissaan', ['ihana', 'korkea', 'rakas']),
          mc('high', 'korkea', ['peloissaan', 'valmis', 'ihana']),
          mc('lovely', 'ihana', ['mahtava', 'valmis', 'kaunotar']),
          mc('an island', 'saari', ['meri', 'patsas', 'toimisto']),

        ]
      },
      {
        title: 'Tomatoes!', intro: 'Sanoja kappaleesta 3.',
        items: [
          mc('fresh', 'tuore', ['kuuma', 'uusi', 'hauska']),
          mc('friendly', 'ystävällinen', ['hauska', 'vilkas', 'meluisa']),
          mc('a ghost', 'kummitus', ['talo', 'katto', 'avain']),

          mc('Have a nice day!', 'Mukavaa päivää!', ['Ei hassummin!', 'Tätä tietä!', 'Mennään!']),

        ]
      }
    ]
  },
  {
    id: 'grammar', name: 'Kielioppi', sub: 'am, are, is ja monikko', icon: '✏️',
    sections: [
      {
        title: 'am, are, is', intro: 'Valitse oikea muoto tai täydennä lause.',
        note: '<table><tr><td>I</td><td>am</td></tr><tr><td>you</td><td>are</td></tr><tr><td>he / she / it</td><td>is</td></tr><tr><td>we / you / they</td><td>are</td></tr></table>',
        items: [
          mc('I ___ from London.', 'am', ['are', 'is']),
          mc('She ___ hungry.', 'is', ['am', 'are']),
          mc('They ___ in the city.', 'are', ['is', 'am']),
          mc('We ___ tired.', 'are', ['is', 'am']),
          mc('The cat ___ on the mailbox.', 'is', ['are', 'am']),
          wr('He ___ thirsty.', ['is']),
          wr('I ___ in a hurry.', ['am']),
          wr('It ___ in England.', ['is']),
          wr('We ___ at the airport.', ['are']),
          wr('Kirjoita englanniksi: Minä olen Lontoosta.', ['I am from London', 'I\'m from London'], { wide: true }),
          wr('Kirjoita englanniksi: Me olemme janoisia.', ['We are thirsty', 'We\'re thirsty'], { wide: true }),
        ]
      },
      {
        title: 'Lyhyet muodot ja kieltolauseet', intro: 'Täydennä lyhyet muodot ja kieltolauseet.',
        note: '<table><tr><td>I\'m</td><td>I\'m not</td></tr><tr><td>you\'re</td><td>you aren\'t</td></tr><tr><td>he\'s / she\'s / it\'s</td><td>he / she / it isn\'t</td></tr><tr><td>we\'re / they\'re</td><td>we / they aren\'t</td></tr></table>',
        items: [
          mc('She ___ at school. (ei)', 'isn\'t', ['aren\'t', 'am not']),
          mc('We ___ hungry. (emme)', 'aren\'t', ['isn\'t', 'am not']),
          mc('I ___ tired. (en)', 'am not', ['isn\'t', 'aren\'t']),
          mc('Lyhyt muoto: they are', 'they\'re', ['their', 'they\'is', 'theyre']),
          mc('Lyhyt muoto: I am', 'I\'m', ['Im', 'I\'am', 'I\'re']),
          wr('he is not → he ___', ['isn\'t']),
          wr('they are not → they ___', ['aren\'t']),

      {
        title: 'Kysymykset ja lyhyet vastaukset', intro: 'Muuta lause kysymykseksi ja vastaa lyhyesti.',
        note: '<table><tr><td>Are you happy?</td><td>Yes, I am. / No, I\'m not.</td></tr><tr><td>Is he a cook?</td><td>Yes, he is. / No, he isn\'t.</td></tr><tr><td>Are they at school?</td><td>Yes, they are. / No, they aren\'t.</td></tr></table>',
        items: [
          mc('Are you strong? Yes, ___.', 'I am', ['I\'m', 'you are', 'it is']),
          mc('Is your dad a cook? Yes, ___.', 'he is', ['she is', 'it is', 'they are']),

          mc('Am I tall? No, ___.', 'you aren\'t', ['I\'m not', 'I aren\'t', 'he isn\'t']),
          mc('Is your school bag heavy? Yes, ___.', 'it is', ['he is', 'they are', 'I am']),
          wr('You are strong. → ___ you strong?', ['Are']),
          wr('He is a cook. → ___ he a cook?', ['Is']),
          wr('I am tall. → ___ I tall?', ['Am']),
          wr('Are we at school? No, we ___.', ['aren\'t']),
          wr('Is your sister in the cinema? Yes, she ___.', ['is']),
          wr('Järjestä sanat kysymykseksi: friends / funny / your / are', ['Are your friends funny'], { wide: true }),

      },
      {
        title: 'Monikko', intro: 'Yksikkö → monikko. Muista -s, -es ja y → ies.',
        note: '<table><tr><td>a tree</td><td>trees</td></tr><tr><td>a bush</td><td>bush<b>es</b></td></tr><tr><td>a church</td><td>church<b>es</b></td></tr><tr><td>a potato</td><td>potato<b>es</b></td></tr><tr><td>a strawberry</td><td>strawberr<b>ies</b></td></tr></table>',
        items: [
          mc('Monikko: a bush', 'bushes', ['bushs', 'bushies', 'bush\'s']),
          mc('Monikko: a church', 'churches', ['churchs', 'churchies', 'church\'s']),
          mc('Monikko: a potato', 'potatoes', ['potatos', 'potatoies', 'potatoz']),
          mc('Monikko: a strawberry', 'strawberries', ['strawberrys', 'strawberryes', 'strawberry\'s']),
          mc('Missä sanassa -es äännetään /iz/?', 'buses', ['rocks', 'flowers', 'trees']),
          wr('a bush → two ___', ['bushes']),
          wr('a potato → four ___', ['potatoes']),
          wr('a family → two ___', ['families']),
          wr('a bus → three ___', ['buses']),
          wr('Small ___! (pumpkin)', ['pumpkins']),
          wr('How many mushrooms can you see? – I can see ___ mushrooms.', ['four', '4'], { pic: rep('🍄', 4) }),
          wr('I can only see ___ tree.', ['one', '1'], { pic: '🌳' }),
          wr('How many tomatoes can you see? – I can see ___ tomatoes.', ['five', '5'], { pic: rep('🍅', 5) }),
        ]
      }
    ]
  }
];

/* ---------- logic ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s, art) => {
  s = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[’‘`´]/g, "'").replace(/[^a-z0-9'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
  if (art) s = s.replace(/^(a|an|the) /, '');
  return s;
};
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const state = {};   // tabId -> {checked, score, total}
let current = 'pics';
let uid = 0;
let runtime = {};   // tabId -> [ {item, el, get()} ]

const tabsEl = document.getElementById('tabs');
const panel = document.getElementById('panel');

function totalFor(tab) { return tab.sections.reduce((n, s) => n + s.items.length, 0); }

function renderTabs() {
  tabsEl.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.role = 'tab';
    b.setAttribute('aria-selected', t.id === current);
    const st = state[t.id];
    b.innerHTML = `<span>${t.icon} ${t.name}</span><small>${st && st.checked ? `<span class="done">✅ ${st.score} / ${st.total}</span>` : t.sub}</small>`;
    b.onclick = () => { current = t.id; renderTabs(); renderPanel(); window.scrollTo({ top: 0 }); };
    tabsEl.appendChild(b);
  });
}

function renderPanel() {
  const tab = TABS.find(t => t.id === current);
  panel.innerHTML = '';
  runtime[tab.id] = [];
  let n = 0;
  tab.sections.forEach((sec, si) => {
    const s = document.createElement('section'); s.className = 'sec';
    s.innerHTML = `<div class="sec-head"><div class="ribbon">${si + 1}</div><div><h2>${esc(sec.title)}</h2><p>${esc(sec.intro)}</p></div></div>`;
    if (sec.note) {
      const d = document.createElement('details'); d.className = 'note';
      d.innerHTML = `<summary>Muistilappu (kurkista vain jos tarvitset)</summary><div>${sec.note}</div>`;
      s.appendChild(d);
    }
    sec.items.forEach(item => { n++; s.appendChild(buildQ(tab.id, item, n)); });
    panel.appendChild(s);
  });

  const act = document.createElement('div'); act.className = 'actions';
  act.innerHTML = `<button class="btn" type="button" id="chk">Tarkista osa</button><button class="btn alt" type="button" id="rst">Aloita osa alusta</button>`;
  panel.appendChild(act);
  const res = document.createElement('div'); res.className = 'result'; res.id = 'res'; res.setAttribute('aria-live', 'polite');
  panel.appendChild(res);
  document.getElementById('chk').onclick = () => check(tab);
  document.getElementById('rst').onclick = () => { delete state[tab.id]; renderTabs(); renderPanel(); updateTotals(); window.scrollTo({ top: 0 }); };

}

function buildQ(tabId, item, n) {
  const id = ++uid;
  const el = document.createElement('article'); el.className = 'q';
  let html = `<span class="num">${n}</span><div class="qbody">`;
  if (item.pic) html += `<div class="pic" aria-hidden="true">${item.pic}</div>`;
  let get;
  if (item.t === 'mc') {
    html += `<p class="prompt">${esc(item.q)}</p><div class="opts" role="radiogroup">`;
    shuffle(item.opts).forEach(o => {
      html += `<label class="opt"><input type="radio" name="q${id}" value="${esc(o).replace(/"/g, '&quot;')}"><span>${esc(o)}</span></label>`;
    });
    html += `</div>`;
    html += `<div class="fb" id="fb${id}"></div></div>`;
    el.innerHTML = html;
    get = () => { const c = el.querySelector('input:checked'); return c ? c.value : ''; };
  } else {
    const wide = item.wide ? ' wide' : '';
    const input = `<input type="text" class="${wide.trim()}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Vastaus">`;
    if (item.q.includes('___')) {
      const [a, b] = item.q.split('___');
      html += `<div class="write"><span>${esc(a)}</span>${input}<span>${esc(b)}</span></div>`;
    } else {
      html += `<p class="prompt">${esc(item.q)}</p><div class="write">${input}</div>`;
    }
    html += `<div class="fb" id="fb${id}"></div></div>`;
    el.innerHTML = html;
    get = () => el.querySelector('input[type=text]').value;
  }
  runtime[tabId].push({ item, el, get, fb: () => el.querySelector('.fb') });
  return el;
}

function isRight(item, given) {
  if (!given.trim()) return false;
  if (item.t === 'mc') return given === item.a;
  return item.ans.some(a => norm(a, item.art) === norm(given, item.art));
}

function check(tab) {
  let score = 0;
  runtime[tab.id].forEach(r => {
    const given = r.get();
    const ok = isRight(r.item, given);
    if (ok) score++;
    r.el.classList.remove('ok', 'bad'); r.el.classList.add(ok ? 'ok' : 'bad', 'locked');
    r.el.querySelectorAll('input').forEach(i => i.disabled = true);
    const fb = r.fb();
    const right = r.item.t === 'mc' ? r.item.a : r.item.ans[0];
    fb.className = 'fb show ' + (ok ? 'good' : 'nope');
    fb.textContent = ok ? 'Oikein! ✔' : (given.trim() ? `Oikea vastaus: ${right}` : `Vastaus puuttuu. Oikea vastaus: ${right}`);
  });
  const total = totalFor(tab);
  state[tab.id] = { checked: true, score, total };
  const pct = score / total;
  const stars = pct >= .9 ? '⭐⭐⭐' : pct >= .7 ? '⭐⭐' : pct >= .5 ? '⭐' : '';
  const msg = pct >= .9 ? 'Mahtavaa! Nutty on ylpeä sinusta!' : pct >= .7 ? 'Hyvin meni! Katso vielä virheet läpi.' : pct >= .5 ? 'Hyvä alku! Harjoittele virheeksi menneitä ja yritä uudelleen.' : 'Nutty uskoo sinuun! Kertaa sanat ja kokeile uudestaan.';
  const res = document.getElementById('res');
  res.innerHTML = `<svg aria-hidden="true"><use href="#nutty"/></svg><div><h3>${tab.name}: ${score} / ${total}</h3><div class="stars" aria-hidden="true">${stars}</div><p>${msg}</p></div>`;
  res.classList.add('show');
  // keep tab scores, but flag the panel as locked
  renderTabsKeep();
  updateTotals();
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderTabsKeep() {
  [...tabsEl.children].forEach((b, i) => {
    const t = TABS[i]; const st = state[t.id];
    b.querySelector('small').innerHTML = st && st.checked ? `<span class="done">✅ ${st.score} / ${st.total}</span>` : t.sub;
  });
}

function updateTotals() {
  const done = TABS.filter(t => state[t.id] && state[t.id].checked);
  const sc = done.reduce((n, t) => n + state[t.id].score, 0);
  const tot = done.reduce((n, t) => n + state[t.id].total, 0);
  document.getElementById('sbParts').textContent = `${done.length} / ${TABS.length}`;
  document.getElementById('sbScore').textContent = `${sc} / ${tot}`;
  const grand = document.getElementById('grand');
  if (done.length === TABS.length) {
    const pct = sc / tot;
    const stars = pct >= .9 ? '⭐⭐⭐' : pct >= .7 ? '⭐⭐' : pct >= .5 ? '⭐' : '🌱';
    grand.innerHTML = `<svg aria-hidden="true"><use href="#nutty"/></svg><div><h3>Koko koe: ${sc} / ${tot}</h3><div class="stars" aria-hidden="true">${stars}</div><p>Kaikki kolme osaa tehty. Hienoa työtä!</p></div>`;
    grand.classList.add('show');
  } else { grand.classList.remove('show'); grand.innerHTML = ''; }
}

/* Switching tabs rebuilds the panel (fresh shuffle); checked scores stay visible in the tab buttons. */
renderTabs();
renderPanel();
updateTotals();
</script>
</body>
</html>
